# Phase 1 single-server stack. See docs/11-DEPLOYMENT.md.
# Usage: docker compose -f infra/docker-compose.yml up -d --build
name: hrms

services:
  app:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
    env_file: ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/var/www/html
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ../backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hrms}
      POSTGRES_USER: ${DB_USERNAME:-hrms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hrms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Queue workers (Horizon-ready). Runs the default queue until Horizon is added.
  horizon:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
    command: php artisan queue:work --tries=3 --timeout=120
    env_file: ../backend/.env
    depends_on:
      - app
      - redis
    volumes:
      - ../backend:/var/www/html
    restart: unless-stopped

  # Scheduler: subscription sweeps, leave accrual, renewals.
  scheduler:
    build:
      context: ..
      dockerfile: infra/docker/php/Dockerfile
    entrypoint: /bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file: ../backend/.env
    depends_on:
      - app
    volumes:
      - ../backend:/var/www/html
    restart: unless-stopped

  # Next.js frontend SPA. The browser loads it on :3000 and calls the API on :8000.
  # NEXT_PUBLIC_API_URL is baked at build time, so rebuild if you change it.
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  pgdata:
